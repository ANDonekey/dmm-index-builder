# 查询 API 的 nginx 片段
#
# 追加到 /etc/nginx/conf.d/dmmpv.conf 的 server { } 内，
# 放在 `location / { return 403; }` **之前**（nginx 前缀匹配按最长优先，顺序不影响，
# 但放在 403 前面更不容易被误读）。
#
# 复用现有域名，不必再签证书：https://cc3001.fastcdn.dpdns.org/api?code=ABP-888
#
# ⚠️ proxy_pass 后面**不要加尾斜杠**：加了会把 /api 前缀剥掉，
#    而服务端本身已兼容 /api 前缀，保留原样最直观。

    # 查询：/api?code=ABP-888 与 /api/health
    location = /api {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # JSON 很小，缓冲反而更好（不像视频要关掉）
        proxy_buffering on;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_read_timeout 10s;
    }
