# 查询 API 的 nginx 片段
#
# 追加到 /etc/nginx/conf.d/dmmpv.conf 的 server { } 内，
# 放在 `location / { return 403; }` **之前**（nginx 前缀匹配按最长优先，顺序不影响，
# 但放在 403 前面更不容易被误读）。
#
# 复用现有域名，不必再签证书：https://cc3001.fastcdn.dpdns.org/api?code=ABP-888
#
# ⚠️ proxy_pass 后面**不要加尾斜杠**：加了会把 /api 前缀剥掉，
#    而服务端本身已兼容 /api 前缀，保留原样最直观。
#
# ⚠️ 本片段引用 nginx-dmmpv.conf 顶部 http 级声明的 dmm_api / dmm_conn 和
#    $dmm_client_ip。**先应用那个文件，再应用这个**，否则 nginx -t 报
#    "unknown limit_req zone"。

    # 查询：/api?code=ABP-888 与 /api/health
    location = /api {
        # 准入靠 X-Dmm-Key（只有本站 Pages Functions 有），这里只做频次兜底：
        # 边缘缓存命中时根本不到源站，能走到这儿的多半是没走代理的直接调用。
        limit_req  zone=dmm_api burst=30 nodelay;
        limit_conn dmm_conn 16;

        # 服务端要读这个头；nginx 默认透传，这里显式写出来是为了让「为什么
        # 线上一直 401」这种问题不用去翻默认行为。
        proxy_set_header X-Dmm-Key $http_x_dmm_key;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # JSON 很小，缓冲反而更好（不像视频要关掉）
        proxy_buffering on;
        proxy_read_timeout 10s;
    }

    location /api/ {
        limit_req  zone=dmm_api burst=30 nodelay;
        limit_conn dmm_conn 16;

        proxy_set_header X-Dmm-Key $http_x_dmm_key;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_read_timeout 10s;
    }
