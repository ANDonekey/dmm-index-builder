# DMM freepv 反代外层：TLS + Authenticated Origin Pull + 反代到 Go(127.0.0.1:8080)
# 内层 Go 负责走日本代理回源与磁盘缓存；这里只做 TLS、鉴权、流式转发。

# ── 访问控制（http 级定义，下面各 location 引用）─────────────────────────────
#
# ⚠️ 这一段必须留在 `server {` **外面**：limit_req_zone / map / limit_conn_zone
#    只能在 http 上下文里声明。conf.d/*.conf 是被 include 进 http{} 的，所以写在
#    文件顶部就是 http 级。写进 server 里 nginx -t 会直接报 "directive is not
#    allowed here"。
#
# ⚠️ nginx-api.conf / nginx-mirror.conf 里引用了这里声明的 zone 和变量。
#    单独应用那两个片段而没应用本文件 → nginx 起不来（unknown limit_req zone）。
#    顺序：先本文件，再片段。

# 真实客户端 IP：nginx 前面是 Cloudflare，$remote_addr 永远是 CF 边缘 IP，
# 拿它做限流键等于全站共用一个桶 —— 一个人刷就能把所有人一起掐死。
# CF 把真实客户端 IP 放在 X-Forwarded-For 的第一段，取出来当键。
#
# ⚠️ 前提是本 server 开着 ssl_verify_client on（Authenticated Origin Pull）：
#    只有 CF 能连进来，XFF 才可信。哪天关掉它，这个键就变成可伪造的了。
map $http_x_forwarded_for $dmm_client_ip {
    default               $remote_addr;
    "~*^([0-9a-fA-F.:]+)" $1;
}

# 查询接口：单行 SQLite 索引，很轻；但被遍历就会变成 D1 时代那个翻版。
limit_req_zone  $dmm_client_ip zone=dmm_api:10m   rate=120r/m;
# 视频：CF 命中时不回源，这里只统计真正的回源请求，给宽一点。
limit_req_zone  $dmm_client_ip zone=dmm_media:10m rate=600r/m;
limit_conn_zone $dmm_client_ip zone=dmm_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name cc3001.fastcdn.dpdns.org pv3001.fastcdn.dpdns.org;

    ssl_certificate     /etc/nginx/certs/dmmpv-origin.crt;
    ssl_certificate_key /etc/nginx/certs/dmmpv-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dmmpv:10m;

    # Authenticated Origin Pull：只接受带 CF 客户端证书的回源请求，
    # 扫到源站 IP 直接握手失败（绕过 CF 打源站的请求一律拒）。
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client      on;

    access_log /var/log/nginx/dmmpv-access.log;
    error_log  /var/log/nginx/dmmpv-error.log;

    # 公共转发设置放在 server 级，两个 location 只保留 proxy_pass
    # （nginx 的 proxy_set_header 是「本级没定义才继承上级」，所以这样不会丢）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Connection        "";
    proxy_set_header Range             $http_range;
    proxy_set_header If-Range          $http_if_range;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # 41MB 不能先缓冲到 nginx 临时目录，必须边收边发
    proxy_buffering          off;
    proxy_request_buffering  off;
    proxy_read_timeout       300s;   # 首次回源要下完整个文件
    proxy_send_timeout       300s;

    # 老体系：/litevideo/freepv/<a>/<ab>/<stem>/<stem>_<q>_<v>.mp4
    location /litevideo/freepv/ {
        # 防盗链：有 Referer 但不是自家站就拒，空 Referer 放行。
        # 空必须放行 —— 隐私模式、App 内嵌播放器、部分原生播放器都不发 Referer，
        # 拦了会误伤真实用户。页面是 strict-origin-when-cross-origin，跨域只发
        # origin（不带路径），所以只比主机。
        if ($http_referer !~* "^(|https?://([a-z0-9-]+\.)*(fastcdn\.dpdns\.org|javdb\.com|pages\.dev|localhost)(:[0-9]+)?/)") {
            return 403;
        }

        limit_req  zone=dmm_media burst=60 nodelay;
        limit_conn dmm_conn 32;

        proxy_pass http://127.0.0.1:8080;
    }

    # 新体系：/pv/<62位随机token>/<file>.mp4
    # ⚠️ 少了这一段，新增的 9 万条 /pv/ 预览会全部落到下面的 location / 被 403 掉。
    location /pv/ {
        if ($http_referer !~* "^(|https?://([a-z0-9-]+\.)*(fastcdn\.dpdns\.org|javdb\.com|pages\.dev|localhost)(:[0-9]+)?/)") {
            return 403;
        }

        limit_req  zone=dmm_media burst=60 nodelay;
        limit_conn dmm_conn 32;

        proxy_pass http://127.0.0.1:8080;
    }

    # 其它路径一律不服务
    location / {
        return 403;
    }
}
