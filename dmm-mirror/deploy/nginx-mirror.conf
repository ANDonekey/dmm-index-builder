# 镜像反代的 nginx 片段
#
# 追加到 /etc/nginx/conf.d/dmmpv.conf 的 server { } 内，
# 放在 `location / { return 403; }` 之前。
#
# 访问：https://cc3001.fastcdn.dpdns.org/mirror/litevideo/freepv/.../xxx.mp4
#
# ⚠️ nginx 这里**不做任何缓存**（没有 proxy_cache）。缓存全部交给 Cloudflare，
#    nginx 只负责把流原样递过去 —— VPS 磁盘只剩 9.7G，装不下视频。
#
# ⚠️ 本片段引用 nginx-dmmpv.conf 顶部 http 级声明的 dmm_media / dmm_conn 和
#    $dmm_client_ip。**先应用那个文件，再应用这个**，否则 nginx -t 报
#    "unknown limit_req zone"。

    location /mirror/ {
        # 防盗链：有 Referer 但不是自家站就拒，空 Referer 放行。
        # 空必须放行 —— 隐私模式、App 内嵌播放器、部分原生播放器都不发 Referer。
        # 真正的防盗链是 URL 上的签名（?e=&s=），这里只是最外层的一道筛子，
        # 挡住「把链接贴到论坛/播放器里」这种最省事的盗用。
        if ($http_referer !~* "^(|https?://([a-z0-9-]+\.)*(fastcdn\.dpdns\.org|javdb\.com|pages\.dev|localhost)(:[0-9]+)?/)") {
            return 403;
        }

        limit_req  zone=dmm_media burst=60 nodelay;
        limit_conn dmm_conn 32;

        proxy_pass http://127.0.0.1:8091;

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header Connection      "";
        proxy_set_header Range           $http_range;
        proxy_set_header If-Range        $http_if_range;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 几十 MB 的视频不能先缓冲到 nginx 临时盘
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;

        # 别让 nginx 覆盖后端给的缓存头（CF 靠它决定缓存多久）
        proxy_ignore_headers X-Accel-Expires;
    }
